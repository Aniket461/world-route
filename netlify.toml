[build]
  base = "frontend"
  command = "npm run build:netlify"
  publish = "dist/frontend/browser"

[build.environment]
  NODE_VERSION = "22"

# Proxy API to Railway so the browser can use same-origin /api/* (no CORS needed).
# Keep this above the SPA fallback.
[[redirects]]
  from = "/api/*"
  to = "https://world-route.up.railway.app/api/:splat"
  status = 200
  force = true

# SPA fallback — Angular client-side routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optional security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
